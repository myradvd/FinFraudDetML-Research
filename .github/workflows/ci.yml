name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      # The competition data is not in the repo, so CI runs the data-free tests only.
      # With the CSVs in data/, `python -m fraudlab verify` also checks the submission byte for byte.
      - name: Data-free smoke test of the final model bundle
        run: python -c "import joblib; b = joblib.load('final_notebook/model.pkl'); assert len(b['models']) == 3; print('model.pkl OK, flag share', b['share'])"
